
version: '3.8'

services:
  # ============================================
  # RabbitMQ Message Broker
  # ============================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
      - "15692:15692"    # Prometheus metrics (optional)
    environment:
      # Basic credentials
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
      
      # Performance tuning
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2"  # Limit CPU cores
      # RABBITMQ_VM_MEMORY_HIGH_WATERMARK: 0.5        # 50% of container memory
      
      # Logging
      RABBITMQ_LOGGING: "true"
      RABBITMQ_LOGS: "-"
    volumes:
      # Persistent data
      - rabbitmq_data:/var/lib/rabbitmq
      # Custom configuration (optional)
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - "com.example.description=RabbitMQ Message Broker"
      - "com.example.environment=development"

  secoretrader:
    build:
      context: .
      dockerfile: SecoreTrader/Dockerfile
    container_name: secoretrader
    ports:
      - "5000:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
    depends_on:
      - rabbitmq
    networks:
      - microservices-network
    restart: unless-stopped

  markettrader:
    build:
      context: .
      dockerfile: MarketTrader/Dockerfile
    container_name: markettrader
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
    depends_on:
      - rabbitmq
    networks:
      - microservices-network
    restart: unless-stopped

# ============================================
# Networks
# ============================================
networks:
  microservices-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  rabbitmq_data:
    driver: local
